<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>PuzzleTracker</title>
    <meta name="description" content="Track your daily puzzle games. Paste a result from any game and see your streaks, averages and history.">
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Silkscreen&family=Young+Serif&display=swap">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main id="app">
        <noscript>PuzzleTracker needs JavaScript to run.</noscript>
    </main>

    <script src="js/rules.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/games.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/whimsy.js"></script>
    <script src="js/builder.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
